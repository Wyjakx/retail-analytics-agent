[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-analytics-agent"
version = "0.1.0"
description = "A governed retail analytics chat prototype with Google ADK and BigQuery"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11,<3",
    "rich>=13.9,<15",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
live = ["google-adk==2.11.0", "google-cloud-bigquery>=3.30,<4"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
retail-agent = "retail_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
